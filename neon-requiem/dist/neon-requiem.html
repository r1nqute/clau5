  let actx = null;
  function sfx(type) {
    if (!meta.settings.sound || NR.headless) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!actx) actx = new AC();
      if (actx.state === 'suspended') actx.resume();
      const t = actx.currentTime;
      const tone = (f, dur, wave, vol, at, slide) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = wave; o.frequency.setValueAtTime(f, t + at);
        if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + at + dur);
        g.gain.setValueAtTime(0.0001, t + at);
        g.gain.exponentialRampToValueAtTime(vol, t + at + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + at + dur);
        o.connect(g); g.connect(actx.destination); o.start(t + at); o.stop(t + at + dur + 0.02);
      };

    on: false, ctx: null, c: null, drops: [], w: 0, h: 0, raf: 0,
    init() {
      this.c = document.getElementById('rain');
      if (!this.c) return;
      this.ctx = this.c.getContext('2d');
      const resize = () => {
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        this.w = this.c.width = Math.floor(window.innerWidth * dpr);
        this.h = this.c.height = Math.floor(window.innerHeight * dpr);
        const n = Math.min(140, Math.floor(window.innerWidth / 9));
        this.drops = Array.from({ length: n }, () => this.drop(true));
      };
      window.addEventListener('resize', resize);
      resize();
      if (meta.settings.motion) this.start(); else this.still();
    },
    drop(any) {
      return { x: Math.random() * this.w * 1.2, y: any ? Math.random() * this.h : -20, l: 10 + Math.random() * 26, v: 6 + Math.random() * 9, a: 0.08 + Math.random() * 0.22, m: Math.random() < 0.12 };
    },
    start() {
      this.on = true;
      const step = () => {
        if (!this.on) return;
        const g = this.ctx; g.clearRect(0, 0, this.w, this.h);
        g.lineWidth = 1;
        for (const d of this.drops) {
          g.strokeStyle = d.m ? `rgba(255,63,142,${d.a})` : `rgba(92,242,220,${d.a * 0.8})`;
          g.beginPath(); g.moveTo(d.x, d.y); g.lineTo(d.x - d.l * 0.22, d.y + d.l); g.stroke();
          d.y += d.v; d.x -= d.v * 0.22;
          if (d.y > this.h + 30) Object.assign(d, this.drop(false));
        }
        this.raf = requestAnimationFrame(step);
      };
      cancelAnimationFrame(this.raf); this.raf = requestAnimationFrame(step);
    },
    still() {
      this.on = false; cancelAnimationFrame(this.raf);
      if (!this.ctx) return;
      const g = this.ctx; g.clearRect(0, 0, this.w, this.h);
      for (const d of this.drops) { g.strokeStyle = `rgba(92,242,220,${d.a * 0.5})`; g.beginPath(); g.moveTo(d.x, d.y); g.lineTo(d.x - d.l * 0.22, d.y + d.l); g.stroke(); }
    },
    toggle() { if (meta.settings.motion) this.start(); else this.still(); },
  };

  /* ----------------------------------------------------------------- boot */
  NR.boot = function () {
    app = document.getElementById('app');
    toastEl = document.getElementById('toast');
    app.addEventListener('click', (e) => {
      const b = e.target.closest('[data-a]');
      if (!b || b.disabled || !app.contains(b)) return;
      const fn = ACTIONS[b.dataset.a];
      if (fn) fn(b.dataset.x, b);
    });
    document.addEventListener('keydown', (e) => {
      const tg = e.target && e.target.tagName;
      if (tg === 'INPUT' || tg === 'TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'Escape' && ui.drawer) { ui.drawer = false; render(); return; }
      if (/^[1-9]$/.test(e.key)) {
        const scope = ui.drawer ? null : app.querySelector('.choices, .cards, .moves');
        const btn = scope && scope.querySelector(`[data-key="${e.key}"]`);
        if (btn && !btn.disabled) { e.preventDefault(); btn.click(); }
      } else if (e.key === 'Enter' && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) {
        const p = app.querySelector('.actions .btn.primary');
        if (p) { e.preventDefault(); p.click(); }
      }
    });
    rain.init();
    const hot = window.claude && window.claude.hot;
    if (hot && typeof hot.snapshot === 'function') {
      try { hot.snapshot(() => ({ run, view: ui.view })); } catch (e) { /* 무시 */ }
    }
    const start = (data) => {
      if (data && data.run && data.run.mode) { run = data.run; ui.view = data.view || 'run'; }
      render();
    };
    if (hot && typeof hot.ready === 'function') hot.ready(start);
    else start((hot && hot.data) || {});
  };

  /* 헤드리스 테스트용 코어 API */
  NR.core = {
    newRun, beginAct, prepareStep, chooseCard, enterScene, listChoices, choose, proceed,
    fightMoves, fightAct, fightItem, fightProceed, openShop, buy, sell, leaveShop, useItem, endRun,
    calcChance, reqCheck, applyFx, price,
    get run() { return run; }, set run(v) { run = v; },
    get meta() { return meta; }, set meta(v) { meta = v; },
    TYPES, STAT,
  };
})();
</script>

  NR.def('lore', {
    halcyon: { cat: '도시', title: '자유도시 할시온', text: '2049년 서부 해안 대붕괴 이후, 일곱 개 기업이 공동 출자해 세운 헌장 도시. 법은 기업 헌장이고, 치안은 외주이며, 시민권은 신용 등급으로 산다.\n이름은 그리스 신화에서 왔다. 물총새가 둥지를 트는 동안에는 바다가 잠잠해진다는 「할시온의 날들」.\n이 도시의 바다가 잠잠했던 적은 한 번도 없다.' },

    wraiths: { cat: '세력', title: '유령단', text: '넷 다이버 집단. 정해진 지도자도 회원 명부도 없다. 신조는 단 하나, 「정보는 자유를 원한다」.\n백야의 방화벽을 몇 번이나 뚫었지만, 그때마다 다이버 몇 명이 접속 의자 위에서 영영 깨어나지 못했다.' },

    dawn: {

      blurb: '모두가 사는 미래를 찾았다. 그리고 고래가 돌아왔다.', hint: '미아의 기억 일곱 조각을 모두 모으고, 엄마와 경비 아저씨를 둘 다 구한 채, 깊은 유대와 함께 꼭대기에 올라라.',
      text: (s) => {
        const beats = [];
        if (has(s, 'cyan')) beats.push('"30초 뒤에 송출 콘솔의 관리자 권한이 1분 동안 열려요." 미아의 말이 끝나기도 전에 시안이 그 틈으로 다이브한다. 레테의 내부 문서가 통째로 송출 대기열에 올라간다. "꼬맹이, 넌 진짜… 미쳤다. 최고야."');
        if (has(s, 'bear')) beats.push('곰이 돔 입구에 버티고 선다. 올라오는 경비대가 그의 크롬 팔에 하나씩 튕겨 나간다. "소리한테 자랑할 게 생겼군."');
        if (has(s, 'padre')) beats.push('파드레가 한서린 앞에 선다. 총도 없이. "이사님. 지우고 싶은 기억이 있다는 건, 그만큼 소중한 것을 잃었다는 뜻입니다. 저도 압니다." 한서린은 대답하지 못한다.');
        return `그 뒤의 5분은, 이미 본 영화를 다시 보는 것 같다.
          > 오른쪽으로 두 걸음.
          당신이 움직인 자리에, 천장에서 내려온 포탑의 첫 발이 박힌다. 한서린의 눈이 커진다.
          엘리베이터 문이 열린다. 카론이 한쪽 팔 없이 걸어 나온다. 등 뒤에는 연기 나는 케르베로스의 잔해. "늦지 않았군." 그가 포탑을 맨손으로 뜯어낸다. 카산드라가 한서린에게 보여 준 미래에는 없던 장면이다.
          ${beats.join('\n')}
          ${s.flags.seo_free ? '서유진이 당신 곁에서 제어반에 손을 올린다.' : '돔의 스피커에서 서유진의 목소리가 울린다. 격리실의 단말로, 마지막 권한을 쏟아붓고 있다.'} "미아, 지금이야. 엄마가 길을 열게."
          자정 1분 전. 당신은 케이스를 소켓이 아니라 그 아래의 이식 회선에 연결한다. 58층 생체 실험실로 곧장 이어지는 회선. 서유진이 2년 동안 몰래 깔아 둔 길이다.
          "확률은 사십 퍼센트라고 했죠." 서유진의 목소리가 떨린다.
          > 아니에요, 엄마. 나 계산해 봤어요.
          > {N이} 케이스를 들고 있고, 아저씨가 문을 지키고, 엄마가 버튼을 누르면—
          > 백 퍼센트예요. 이 미래에서는요. 내가 이거 찾느라고 얼마나 오래 걸렸는데요.
          자정.
          레테의 기둥이 빛난다. 하지만 도시로 나가는 것은 망각이 아니다. 레테의 설계도, L-시리즈의 이름 아홉 개, 그리고 스스로를 지우는 마지막 명령어. 기둥의 광섬유가 한 가닥씩 꺼진다.
          한서린이 꺼져 가는 기둥을 바라본다. "…카산드라는 틀린 적이 없는데."
          "틀린 게 아니야." 당신이 말한다. "당신한테 다 보여 주지 않았을 뿐이지."
          손목의 케이스가 식어 간다. 가벼워진다. 텅 빈다.
          그리고 두 층 아래에서, 아홉 살 아이가 처음으로 숨을 들이쉰다.

          늙은 어부의 옆자리에 작은 아이가 앉아 있다. 두꺼운 목도리, 빨개진 코. 그 옆에 당신이, 그 옆에 서유진이, 그 뒤에 얼굴의 반이 아직 거울인 남자가 서 있다.
          "안 오면 어떡해요?" 미아가 묻는다. 진짜 목소리로. 입김이 하얗게 흩어진다.

          수평선이 밝아 온다. 할시온의 바다에, 서른 해 만에 진짜 새벽이 온다.

          검은 수면이 갈라진다. 거대하고, 파랗고, 상처투성이인 등이 솟아오른다. 물기둥이 아침 햇빛에 무지개를 만든다.
          아이가 벌떡 일어선다. 당신의 손을 잡는다. 따뜻하고, 작고, 진짜인 손.
          "{N}! 봤어요?! 봤죠?!"
          "봤어."

  /* ------------------------------------------------------------ 에필로그 */
  NR.D.epilogue = function (s, id) {
    const out = [];
    const dark = id === 'deal' || id === 'throne';
    const f = s.flags;
    if (has(s, 'bear')) {
      if (id === 'throne') out.push('곰은 스파이어 경비대장이 되었다. 그는 당신의 말이 옳다고 믿는다. 소리의 병원비는 전액 지원된다. 그는 그것이 왜 기쁘지 않은지 알지 못한다.');
      else if (id === 'deal') out.push('곰은 그날 밤 아무 말 없이 떠났다. 송출 뒤, 그는 딸의 병실에서 크레용 그림을 오래 들여다본다. 왜 가슴이 답답한지는 기억나지 않는다.');
      else if (f.bear_loyal) out.push('곰은 링으로 돌아가지 않았다. 소리가 퇴원하던 날 그는 크롬 팔로 딸을 번쩍 들어 올렸다. 병원 사람들은 그 거구가 우는 걸 처음 봤다.');
      else out.push('곰은 다시 링에 선다. 이번에는 맞기만 하지 않는다. 소리의 병원비는 아직 멀었지만, 그는 매일 병실에 들른다.');
    }
    if (has(s, 'cyan')) {
      if (id === 'throne') out.push('시안은 넷 깊은 곳으로 숨었다. 당신의 문장이 닿지 않는 마지막 서버로. 그녀는 아직 당신을 기억하고, 그래서 당신을 미워할 수 있는 마지막 사람이다.');
      else if (id === 'deal') out.push('시안은 송출 직전에 포트를 전부 뽑아 버렸다. 유령단의 접속 의자 옆에는 「배신자」라고 적힌 당신의 얼굴이 붙어 있다. 그녀만은 잊지 않았다.');
      else if (f.cyan_loyal) out.push('시안은 유령단에 사과하지 않았다. 대신 접속 의자를 하나 더 들여놓았다. 작은 사이즈로. "꼬맹이 자리야. 언제든 놀러 오라고 해."');
      else out.push('시안은 다시 넷으로 돌아갔다. 가끔 당신의 포트로 좌표 하나가 날아온다. 「여기 방화벽, 같이 뚫을래?」');
    }
    if (has(s, 'padre')) {
      if (dark) out.push('파드레는 성 니콜라오 성당으로 돌아갔다. 그는 매일 미사를 드린다. 신도들은 평온하게 웃으며 앉아 있다. 무엇을 위해 기도하는지는 아무도 모른다. 신부 자신도.');
      else if (f.padre_loyal) out.push('파드레는 이노크를 찾아갔다. 두 사람은 종탑에서 밤새 이야기했다. 다음 날, 녹슨 성자들의 절반이 렌즈를 빼고 진료소 앞에 줄을 섰다.');
      else out.push('파드레는 종탑 진료소로 돌아갔다. 수술대 옆에 작은 촛불 하나가 새로 생겼다. 누구를 위한 것인지는 묻지 않아도 안다.');
    }
    if (f.kiki_saved) {
      out.push(dark
        ? '키키는 밴을 몰고 도시를 떠났다. 대시보드에 드레이크와 모스의 사진을 붙이고. 당신 사진은 떼어 냈다.'
        : '키키의 밴은 요즘 웰스와 바자르를 오가며 약을 실어 나른다. 운임은 받지 않는다. 대시보드에는 넷이 함께 찍은 사진이 아직 붙어 있다.');
    }
    if (f.oh_alive) {
      out.push(dark
        ? '오복국수는 여전히 문을 연다. 마담 오는 가끔 빈 그릇 하나를 더 내놓았다가, 왜 그랬는지 몰라 고개를 갸웃한다.'
        : '마담 오는 손녀를 되찾았다. 오복국수는 다시 문을 열었고, 간판의 꺼진 글자도 고쳤다. 가게 구석에는 늘 비워 두는 자리가 하나 있다. 국수 맛을 궁금해하던 아이의 자리다.');
    } else if (f.oh_dead && !dark) {
      out.push('오복국수의 셔터에는 누군가 매일 국화 한 송이를 꽂아 둔다. 간판은 여전히 「오 국수」다. 아무도 고치지 않는다. 그게 맞는 것 같아서.');
    }
    if (id !== 'dawn') {
      if (f.charon_ally && !dark) out.push('카론은 59층에서 발견되지 않았다. 케르베로스의 잔해 옆에 깨진 거울 조각만 남아 있었다. 석 달 뒤, 웰스의 아이들 사이에 소문이 돈다. 밤마다 그림책을 읽어 주는 거울 얼굴 아저씨가 있다고.');
      else if (f.charon_ally && id === 'deal') out.push('카론은 최종 프로토콜에 덮어쓰였다. 그는 이제 완벽한 회수 요원이다. 임무 중에 낡은 그림책 앞에서 3초간 멈춘다는 보고가 가끔 올라오지만, 오류로 분류되었다.');
      else if (f.charon_dead && !dark) out.push('카론의 잔해는 백야가 회수했다. 기록상 그는 처음부터 존재하지 않았다. 다만 누군가 59층 로비에 그림책 한 권을 놓고 갔다.');
    }
    if (!dark) {
      if (f.docks_ally) out.push('부두 노조는 파업을 끝냈다. 이긴 채로. 바스케스 선장은 7구역 사람들의 포트 교체 비용을 백야에 청구했고, 놀랍게도 받아 냈다.');
      if (f.saints_ally && !f.padre_loyal) out.push('녹슨 성자들은 여전히 기계 속의 신을 믿는다. 다만 이노크의 설교가 조금 바뀌었다. "신은 아이를 보내셨다. 그리고 아이는 노래했다. 우리가 할 일은 듣는 것이다."');
      if (f.rats_informants) out.push('핀과 쥐새끼들은 웰스 북쪽에 「통행료 징수소」를 정식으로 열었다. 요금은 사탕 하나. 운반책은 무료다.');
    }
    return out;
  };
})();
